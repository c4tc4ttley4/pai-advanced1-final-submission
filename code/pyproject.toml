[project]
name = "pai-advanced1-final"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "torchcodec==0.3.0",
  "lerobot==0.4.2",
  "mujoco==3.3.7",
  "Pillow==11.3.0",
  "PyOpenGL==3.1.10",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
